# Builds the Windows installer on a real Windows machine, on every push to
# main. electron-builder can't make an NSIS installer on Linux without Wine,
# so this is how an installer comes out of an Omarchy laptop. The installer
# is kept as the run's artifact (`gh run download` fetches it).
#
# The checks run here too, after the installer is saved, so their results
# on Windows are on record - the path checks only run where there is real
# PowerShell - without holding the installer back. A failure turns the run
# red rather than hiding behind a passing step.
name: windows

on:
  push:
    branches: [main]
    # Words about the app are not the app: no ten-minute build for them.
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Publishing a release needs to write to the repo.
permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      # Self-contained here, unlike `npm run hook:build`: the installer is
      # for any Windows PC, and one without the .NET 10 runtime would
      # otherwise have no Win+Shift+Z and say nothing about why.
      - name: Win+Shift+Z helper
        run: dotnet publish src/hook/WumpyHook.csproj -c Release -o resources/hook -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
      - run: npx electron-vite build
      # Each build its own version and its own release, so an installed
      # Wumpy sees it is newer and updates itself (src/main/updater.ts).
      # Releases are not artifacts: the storage that filled up does not
      # hold them. Built here, published by gh in one step: left to publish
      # itself, electron-builder uploaded two files at once and both tried
      # to create the release - one lost with a 422 and the release was
      # left without its installer. In bash: PowerShell splits
      # -c.extraMetadata... into -c and a file name.
      - run: npx electron-builder --win --x64 --publish never -c.extraMetadata.version=0.1.${{ github.run_number }}
        shell: bash
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=0.1.${{ github.run_number }}
          gh release create "v$v" "dist/Wumpy-$v-setup.exe" "dist/Wumpy-$v-setup.exe.blockmap" dist/latest.yml \
            --target "$GITHUB_SHA" --title "Wumpy $v" \
            --notes "Built from $GITHUB_SHA: $(git log -1 --format=%s)"
      - uses: actions/upload-artifact@v4
        # Storage full is no reason to skip the Windows checks below.
        continue-on-error: true
        with:
          name: wumpy-windows
          path: dist/*-setup.exe
          # A day's testing ran to forty installers and filled the repo's storage,
          # so the next one could not be kept. Each is copied out within the hour.
          retention-days: 3
      - name: Checks, on Windows
        run: npm run typecheck
      # The recorder in Windows' own Chromium, on a fake mic playing a made-up
      # sentence (see the script). A runner has no sound card, which this may
      # need, so a failure here is reported, not fatal.
      - name: The recorder, live on Windows
        continue-on-error: true
        run: node scripts/check-recorder-live.mjs
      # A whole conversation - hold, a question, talking over the answer, a
      # second question, hold to end - in Windows' Chromium, with the main
      # process, transcriber, model and voice stood in for.
      - name: A conversation, live on Windows
        continue-on-error: true
        run: node scripts/check-conversation-live.mjs --show
