appId: dev.psyduckz.wumpy
productName: Wumpy
copyright: Copyright (c) 2026 psyduck-z

# Where an installed Wumpy looks for updates (src/main/updater.ts): the
# releases the Windows workflow publishes on every push. Built into each
# installer as app-update.yml, so it is here even for a build made locally.
publish:
  provider: github
  owner: psyduck-z
  repo: Wumpy
  releaseType: release

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json
  # The voiceprint's model runs on onnxruntime's WebAssembly build, from Node
  # (src/main/voiceprint.ts): ort.node.* and the plain SIMD wasm. The other
  # builds - WebGPU, WebGL, JSEP, JSPI, the browser bundles - are 130 MB
  # nothing here loads.
  - "!node_modules/onnxruntime-web/dist/*.map"
  - "!node_modules/onnxruntime-web/dist/*{jsep,jspi,asyncify,webgpu,webgl,bundle}*"
  - "!node_modules/onnxruntime-web/dist/ort.{all,wasm}*"
  - "!node_modules/onnxruntime-web/dist/ort.{js,mjs,min.js,min.mjs}"
  - "!node_modules/onnxruntime-web/lib/**"

extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - icon.ico
      - tray.png
  # The transcriber, which runs in whatever Python has faster-whisper; see
  # src/main/speech.ts for how one is found.
  - from: resources/speech
    to: speech
  # NVIDIA's Riva protocol files for hosted speech; see src/main/nvspeech.ts.
  - from: resources/riva
    to: riva
  # Clicking and typing on Linux (Hyprland); built from src/linux by
  # scripts/build-linux-helper.mjs. Absent on Windows, which has src/hook.
  - from: resources/linux
    to: linux
  # The Win+Shift+W interception helper (Windows only); see src/hook.
  - from: resources/hook
    to: hook
    filter:
      - WumpyHook.exe

linux:
  # A plain folder: no AppImage (which needs FUSE) and no system package.
  # scripts/install-linux.mjs puts it in ~/.local/share/wumpy and adds the
  # `wumpy` command and a launcher entry.
  target:
    - target: dir
  executableName: wumpy
  icon: resources/icon.png
  category: Utility

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Wumpy
