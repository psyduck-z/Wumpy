appId: dev.psyduckz.wumpy
productName: Wumpy
copyright: Copyright (c) 2026 psyduck-z

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - icon.ico
      - tray.png
  # The transcriber, which runs in whatever Python has faster-whisper; see
  # src/main/speech.ts for how one is found.
  - from: resources/speech
    to: speech
  # NVIDIA's Riva protocol files for hosted speech; see src/main/nvspeech.ts.
  - from: resources/riva
    to: riva
  # The Win+Shift+W interception helper (Windows only); see src/hook.
  - from: resources/hook
    to: hook
    filter:
      - WumpyHook.exe

linux:
  # A plain folder: no AppImage (which needs FUSE) and no system package.
  # scripts/install-linux.mjs puts it in ~/.local/share/wumpy and adds the
  # `wumpy` command and a launcher entry.
  target:
    - target: dir
  executableName: wumpy
  icon: resources/icon.png
  category: Utility

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Wumpy
